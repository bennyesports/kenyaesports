<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Esports | Upcoming Tournaments</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(17, 24, 39, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 1.5rem; }

        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1.2rem 1.8rem; border-radius: 14px; border: 1px solid var(--card-border); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--neon-green); }

        .card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--card-border); padding: 1.6rem; display: flex; flex-direction: column; gap: 1.2rem; }
        .card h2 { font-family: 'Orbitron', sans-serif; font-size: 1.15rem; text-transform: uppercase; }

        .events-grid { display: flex; flex-direction: column; gap: 1rem; }
        .event-card { background: rgba(10, 15, 26, 0.8); border: 1px solid var(--card-border); border-radius: 10px; padding: 1.2rem; display: flex; justify-content: space-between; align-items: center; }
        .event-details { display: flex; flex-direction: column; gap: 0.3rem; }
        .event-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; color: var(--neon-cyan); }
        .event-meta { font-size: 0.9rem; color: var(--text-muted); }
        .prize-tag { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; font-weight: 900; color: var(--neon-green); text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">📅 UPCOMING TOURNAMENTS</div>
        <a href="/" style="color: var(--neon-cyan); text-decoration: none; font-weight: 700;">← Back to Arena</a>
    </header>

    <div class="card">
        <h2>Featured Competitive Events</h2>
        <div class="events-grid" id="eventsContainer">
            <div style="color: var(--text-muted); text-align: center; padding: 2rem;">Loading upcoming tournaments...</div>
        </div>
    </div>
</div>

<script>
    async function loadEvents() {
        const res = await fetch('/api/events');
        const data = await res.json();
        const container = document.getElementById('eventsContainer');

        if (!data.success || data.events.length === 0) {
            container.innerHTML = `<div style="color: var(--text-muted); text-align: center; padding: 2rem;">No upcoming tournaments scheduled right now. Check back soon!</div>`;
            return;
        }

        container.innerHTML = '';
        data.events.forEach(ev => {
            const dateStr = new Date(ev.event_date).toLocaleString();
            const card = document.createElement('div');
            card.className = 'event-card';
            card.innerHTML = `
                <div class="event-details">
                    <div class="event-title">${ev.title}</div>
                    <div class="event-meta">🎮 <b>${ev.game_name}</b> | ⏰ ${dateStr}</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.3rem;">${ev.description || 'No description provided.'}</div>
                </div>
                <div style="text-align: right;">
                    <div style="font-size: 0.8rem; color: var(--text-muted);">PRIZE POOL</div>
                    <div class="prize-tag">${parseFloat(ev.prize_pool).toLocaleString()} KES</div>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem;">Entry: ${ev.entry_fee} KES</div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    loadEvents();
</script>

</body>
</html>
