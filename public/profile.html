<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenya Esports | Player Profile & Stats</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #07090e;
            --card-bg: rgba(17, 24, 39, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --neon-green: #00ff88;
            --neon-cyan: #00e5ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 1.5rem; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1.2rem 1.8rem; border-radius: 14px; border: 1px solid var(--card-border); }
        .logo { font-family: 'Orbitron', sans-serif; font-size: 1.3rem; font-weight: 900; color: var(--neon-green); }
        .card { background: var(--card-bg); border-radius: 14px; border: 1px solid var(--card-border); padding: 1.6rem; display: flex; flex-direction: column; gap: 1rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
        .stat-box { background: rgba(10, 15, 26, 0.8); padding: 1.2rem; border-radius: 10px; border: 1px solid var(--card-border); text-align: center; }
        .stat-value { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--neon-cyan); margin-top: 0.3rem; }
        .tx-list { display: flex; flex-direction: column; gap: 0.6rem; max-height: 300px; overflow-y: auto; }
        .tx-item { display: flex; justify-content: space-between; background: rgba(10, 15, 26, 0.8); padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--card-border); font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">⚡ PLAYER PROFILE</div>
        <a href="/" style="color: var(--neon-cyan); text-decoration: none; font-weight: 700;">← Back to Arena</a>
    </header>

    <div class="card">
        <h2 id="profileEmail" style="font-family:'Orbitron';">Loading Profile...</h2>
        <div class="stats-grid">
            <div class="stat-box">
                <div style="color: var(--text-muted); font-size:0.85rem;">TOTAL MATCHES</div>
                <div class="stat-value" id="statMatches">0</div>
            </div>
            <div class="stat-box">
                <div style="color: var(--text-muted); font-size:0.85rem;">VICTORIES</div>
                <div class="stat-value" id="statWins" style="color: var(--neon-green);">0</div>
            </div>
            <div class="stat-box">
                <div style="color: var(--text-muted); font-size:0.85rem;">TOTAL EARNINGS</div>
                <div class="stat-value" id="statEarnings">0 KES</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h2 style="font-family:'Orbitron'; font-size:1.1rem;">Financial & Stake Ledger</h2>
        <div class="tx-list" id="txContainer">
            <div style="color: var(--text-muted); text-align:center; padding: 1rem;">Loading ledger...</div>
        </div>
    </div>
</div>

<script>
    const authToken = localStorage.getItem('token');
    if (!authToken) {
        alert('Please login first on the main arena page.');
        window.location.href = '/';
    }

    async function loadProfile() {
        const res = await fetch('/api/user/profile-stats', {
            headers: { 'Authorization': `Bearer ${authToken}` }
        });
        const data = await res.json();
        if (!data.success) return alert('Failed to load profile');

        document.getElementById('profileEmail').innerText = data.user.email;
        document.getElementById('statMatches').innerText = data.stats.total_matches || 0;
        document.getElementById('statWins').innerText = data.stats.wins || 0;
        document.getElementById('statEarnings').innerText = `${parseFloat(data.stats.total_won).toFixed(2)} KES`;

        const txContainer = document.getElementById('txContainer');
        if (data.transactions.length === 0) {
            txContainer.innerHTML = `<div style="color: var(--text-muted); text-align:center;">No transactions recorded yet.</div>`;
            return;
        }

        txContainer.innerHTML = '';
        data.transactions.forEach(tx => {
            const isPositive = ['DEPOSIT', 'MATCH_WIN_PAYOUT', 'MATCH_REFUND'].includes(tx.type);
            const item = document.createElement('div');
            item.className = 'tx-item';
            item.innerHTML = `
                <div><b>${tx.type}</b> <small style="color:var(--text-muted); display:block;">Ref ID: #${tx.reference_id || 'N/A'}</small></div>
                <div style="color: ${isPositive ? 'var(--neon-green)' : '#ef4444'}; font-weight:700;">${isPositive ? '+' : '-'}${parseFloat(tx.amount).toFixed(2)} KES</div>
            `;
            txContainer.appendChild(item);
        });
    }

    loadProfile();
</script>

</body>
</html>
